# Project settings. Paths are relative to the repo root.
# Design parameters are copied from docs/preregistration.md, never invented here.

project:
  name: ai-entry-level-jobs
  preregistration_version: "1.0"

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  tables: results/tables
  figures: results/figures

design:
  # Section 3: data window
  download_start: "2011-01"      # robustness start; one extract covers both starts
  main_start: "2015-01"
  excluded_start: "2020-03"      # main-sample exclusion, applied in analysis, not at extract
  excluded_end: "2021-12"

  # Section 4: age groups
  age_min: 22                    # youngest age any preregistered group needs
  age_max: 64                    # oldest (50-64 placebo group, Section 12)
  treated_ages: [22, 25]
  secondary_ages: [26, 34]
  comparison_ages: [35, 49]
  placebo_ages: [50, 64]
  # Section 4: "All wage and salary employees (private and government)" (set by Aryan 2026-09-30)
  # 22 private for profit, 23 private nonprofit, 25 federal, 27 state, 28 local government.
  # Excluded: 13, 14 self-employed; 29 unpaid family; 26 Armed Forces (already out via EMPSTAT = 1).
  wage_salary_classwkr: [22, 23, 25, 27, 28]

  # Section 5: exposure quintiles
  quintile_cutoff_ages: [22, 64]
  quintile_cutoff_window: ["2015-01", "2020-02"]
  exposure:                      # primary measure: Eloundou et al., GPT-4 beta (set by Aryan 2026-09-30)
    url: https://raw.githubusercontent.com/openai/GPTs-are-GPTs/main/data/occ_level.csv
    sha256: 40c74f53de40aec91c0017d80690cbba915f83a8bb414bcf2f884692f1749acb
    file: eloundou/occ_level.csv   # under paths.raw; never committed
    code_column: "O*NET-SOC Code"
    code_system: O*NET-SOC 2019    # 8-digit, e.g. 15-1252.00
    score_column: dv_rating_beta   # GPT-4 rating, E1 + 0.5*E2
    soc6_aggregation: unweighted_mean   # across 8-digit variants within each 6-digit SOC
    occ_aggregation: unweighted_mean    # across SOC targets when one OCC2010 maps to several
  occ_crosswalk:                 # Census 2018 code list with 2010-to-2018 crosswalk (set by Aryan 2026-09-30)
    url: https://www2.census.gov/programs-surveys/demo/guidance/industry-occupation/2018-occupation-code-list-and-crosswalk.xlsx
    sha256: fca2818d691c32777a4cd733a9ab77c8c5bd47adcacd7ac3aa149bebd45b5f7f
    file: census/2018-occupation-code-list-and-crosswalk.xlsx   # under paths.raw; never committed
    sheet: "2010 to 2018 Crosswalk "   # trailing space is in the file
    # Detailed SOC code -> 2018 Census code, assigned before residual expansion (set by Aryan
    # 2026-09-30): the Census title places 51-9199 under 8990, not 8865 (design_notes.md).
    soc_overrides: {"51-9199": "8990"}
  soc_structure:                 # BLS 2018 SOC structure (set by Aryan 2026-09-30)
    url: https://www.bls.gov/soc/2018/soc_structure_2018.xlsx
    sha256: ade08af40923266f3a854842e888ca3e93c15b26a147c20a2b12a61f4c4f4077
    file: bls/soc_structure_2018.xlsx   # under paths.raw; never committed
    manual: true                   # BLS blocks automated download: fetch by hand, never auto-download
    sheet: "2018 Structure"

  # Section 7: treatment timing
  treatment_month: "2022-12"
  alternative_treatment_months: ["2023-03", "2024-01"]

  # Section 11: decision rule
  no_effect_threshold_pct: 5